<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ark Docs · 文档与博客系统</title>
  <meta name="description" content="基于洛谷 Markdown / KaTeX 编辑器内核构建的轻量文档与博客系统" />

  <!-- 第三方渲染内核（与源文件同版本，已本地化）：KaTeX 0.18.4 数学公式，Prism 1.30.0 代码高亮 -->
  <link rel="stylesheet" href="js/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 简素字体声明：所有 @font-face 走 font-display:swap + 按需加载，默认页面不下载任何 woff2 -->
  <link rel="stylesheet" href="css/fonts.css" />
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="打开导航" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a class="brand" href="#/" aria-label="Ark Docs 首页">Ark&nbsp;Docs</a>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <!-- 占位提示文字已按需求移除；保留 aria-label 供读屏软件识别搜索框 -->
      <input id="searchInput" type="search" aria-label="搜索" autocomplete="off" />
    </div>

    <div class="topbar-actions">
      <button id="themeToggle" class="btn btn-ghost btn-sm" title="切换主题" aria-label="切换主题">浅色</button>
      <a href="#/editor/new" class="btn btn-primary" id="newBtn">新建</a>
    </div>
  </header>

  <!-- 左侧抽屉导航（默认收起） -->
  <aside class="drawer" id="drawer" aria-label="导航">
    <div class="drawer-inner" id="sidebar"><!-- 由 app.js 注入：导航 / 分类 / 标签 --></div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- 主体内容 -->
  <main class="content" id="view" tabindex="-1"><!-- 各视图由 app.js 渲染 --></main>

  <!-- 轻提示 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 第三方内核脚本（本地化，确保在 app.js 之前就绪） -->
  <script src="js/vendor/katex/katex.min.js"></script>
  <script src="js/vendor/prism/prism-core.min.js"></script>
  <script src="js/vendor/prism/prism-clike.min.js"></script>
  <script src="js/vendor/prism/prism-c.min.js"></script>
  <script src="js/vendor/prism/prism-cpp.min.js"></script>
  <script src="js/vendor/prism/prism-python.min.js"></script>
  <script src="js/vendor/prism/prism-java.min.js"></script>
  <script src="js/vendor/prism/prism-pascal.min.js"></script>
  <script src="js/vendor/prism/prism-json.min.js"></script>
  <script src="js/vendor/prism/prism-bash.min.js"></script>
  <script src="js/vendor/prism/prism-go.min.js"></script>
  <script src="js/vendor/prism/prism-rust.min.js"></script>
  <script src="js/vendor/prism/prism-markup.min.js"></script>
  <script src="js/vendor/prism/prism-css.min.js"></script>
  <script src="js/vendor/prism/prism-javascript.min.js"></script>

  <!-- 从源文件抽取的 Markdown 渲染内核（与洛谷编辑器完全一致） -->
  <script src="js/parser.js"></script>
  <!-- 博客系统应用层 -->
  <script src="js/app.js"></script>
</body>
</html>
